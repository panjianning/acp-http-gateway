# ─────────────────────────────────────────────────────────────────────
# acp-http-gateway + pi — one-command deployment
#
#   cp .env.example .env          # set ACP_BEARER_TOKEN
#   docker compose up -d --build
#
# The image is self-contained: the Dockerfile clones acp-http-gateway
# from GitHub and installs pi + pi-acp via npm.  The only host mount is
# ~/.pi/agent (models.json with API keys, sessions, skills, extensions).
# ─────────────────────────────────────────────────────────────────────

services:
  gateway:
    # Remote build context: compose clones the repo itself, so you only
    # need this file + .env — no local checkout required.
    build: https://github.com/panjianning/acp-http-gateway.git
    image: acp-http-gateway:latest
    container_name: acp-http-gateway
    ports:
      - "8766:8766"
    environment:
      # Required.  Clients must send `Authorization: Bearer <token>`.
      ACP_BEARER_TOKEN: ${ACP_BEARER_TOKEN:?set ACP_BEARER_TOKEN in .env}
      # Optional tuning
      ACP_LOG_LEVEL: ${ACP_LOG_LEVEL:-INFO}
      ACP_OPENAI_POOL_MAX: ${ACP_OPENAI_POOL_MAX:-20}
      ACP_OPENAI_POOL_IDLE: ${ACP_OPENAI_POOL_IDLE:-600}
    volumes:
      # pi config: models.json (API keys), sessions, skills, extensions.
      # Point PI_AGENT_DIR elsewhere if your config lives somewhere else.
      - ${PI_AGENT_DIR:-~/.pi/agent}:/root/.pi/agent
    restart: unless-stopped

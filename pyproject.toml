[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-http-gateway"
version = "0.1.0"
description = "Streamable HTTP gateway for the Agent Client Protocol (ACP)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "panjianning", email = "2393661347@qq.com" },
]
requires-python = ">=3.12"
keywords = ["acp", "agent-client-protocol", "http", "sse", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["acp_http_gateway*"]

[project.scripts]
acp-http-gateway = "acp_http_gateway.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-aiohttp>=1.1.1",
]


